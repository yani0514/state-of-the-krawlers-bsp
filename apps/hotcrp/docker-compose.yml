services:
  web:
    build: ${APP_DOCKER_DIR}/web
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.php"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

    volumes:
      - ${APP_COVERAGE_DIR}:/xdebug/

    environment:
      MYSQL_USER: hotcrp
      MYSQL_PASSWORD: hotcrp
      MYSQL_DATABASE: hotcrp
      MYSQL_ROOT_PASSWORD: root
      EXPERIMENT_ID: ${EXPERIMENT_ID}

  mysql:
    image: mysql:8.0.28
    restart: always

    command: --default-authentication-plugin=mysql_native_password

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

    volumes:
      - ${APP_DOCKER_DIR}/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotcrp
      MYSQL_USER: hotcrp
      MYSQL_PASSWORD: hotcrp