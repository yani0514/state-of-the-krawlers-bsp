version: "3"

services:
  web:
    build: ${APP_DOCKER_DIR}/web
    restart: 'always'

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "body=\"$$(curl -fsS http://localhost/index.php)\" || exit 1; printf '%s' \"$$body\" | grep -qi 'Could not connect to the database' && exit 1 || exit 0"
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ${APP_COVERAGE_DIR}:/xdebug/

  db:
    image: mysql:5.7.37
    restart: 'always'

    volumes:
      - ${APP_DOCKER_DIR}/dump.sql:/docker-entrypoint-initdb.d/dump.sql:ro

    ulimits:
      nproc: 65535
      nofile:
        soft: 26677
        hard: 46677

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: dbuser
      MYSQL_PASSWORD: dbpass
      MYSQL_DATABASE: dbname

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -proot --silent"
        ]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s